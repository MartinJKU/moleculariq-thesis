[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miqthesis"
version = "0.1.0"
description = "Reproducible full-parameter SFT and GRPO experiments for MolecularIQ."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
  "datasets>=4.7,<5",
  "jinja2>=3.1",
  "jsonlines>=4.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "pyyaml>=6.0",
  "rich>=13.7",
  "scipy>=1.12",
  "seaborn>=0.13",
  "tabulate>=0.9",
  "tqdm>=4.66",
]

[project.optional-dependencies]
train = [
  "accelerate>=1.4,<2",
  "torch>=2.3",
  "transformers>=4.56.2,<6",
  "trl>=0.23,<2",
  "wandb>=0.17",
]
chem = [
  "moleculariq-core @ git+https://github.com/ml-jku/moleculariq-core.git@a1b89635371c3cd942e44ebeec63ec3665e7743d",
  "rdkit>=2023.9",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.5",
]

[project.scripts]
miq-download = "miqthesis.data.download:main"
miq-prepare-sft = "miqthesis.data.prepare_sft:main"
miq-prepare-grpo = "miqthesis.data.prepare_grpo:main"
miq-train-sft = "miqthesis.training.train_sft:main"
miq-train-grpo = "miqthesis.training.train_grpo:main"
miq-eval = "miqthesis.evaluation.run_lm_eval:main"
miq-aggregate = "miqthesis.evaluation.aggregate_metrics:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

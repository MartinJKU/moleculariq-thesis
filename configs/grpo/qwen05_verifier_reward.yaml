run_id: grpo_verifier
model_name_or_path: checkpoints/sft_multitask
train_file: data/processed/grpo_multitask_train.jsonl
validation_file: data/processed/grpo_multitask_val.jsonl
output_dir: checkpoints/grpo_verifier
reward_type: verifier
max_prompt_length: 768
max_completion_length: 256
num_generations: 4
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 2.0e-6
num_train_epochs: 1
beta: 0.02
temperature: 0.7
top_p: 0.95
bf16: true
gradient_checkpointing: true
logging_steps: 5
eval_steps: 250
save_steps: 250
save_total_limit: 3
save_safetensors: true
seed: 42
report_to: wandb
full_parameter_finetuning: true

